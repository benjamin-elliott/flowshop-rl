[project]
name = "flowshop-rl"
version = "0.1.0"
requires-python = ">=3.0"
dependencies = ["numpy>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
typeCheckingMode = "standard"
